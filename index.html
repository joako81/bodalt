<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sube las fotos de la boda de Lidia y Tomás."
    />
    <title>Sube tus fotos - Lidia y Tomás</title>
    <style>
      :root {
        /* ── LA PALETA DE LA NOVIA ── */
        --color-rosa-claro: #e8cfc3;
        --color-rosa: #d57a7f;
        --color-rosa-intermedio: #9a6b65;
        --color-rosa-oscuro: #4d151a;
        --color-dorado: #daa520;

        /* ── ASIGNACIÓN ARQUITECTÓNICA (Accesibilidad WCAG AAA) ── */
        --color-texto-principal: var(--color-rosa-claro);
        --color-acento: var(--color-dorado);
        --color-boton: var(--color-rosa);
        --color-texto-boton: var(--color-rosa-claro);
        --color-boton-hover: var(--color-rosa-claro);

        --fuente-titulos: "Georgia", serif;
        --fuente-texto: "Helvetica Neue", Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        height: 100dvh;
        width: 100%;
        font-family: var(--fuente-texto);
        color: var(--color-texto-principal);
        overflow: hidden;
      }

      #background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        /* FIX: Desplazamos la foto un 15% desde arriba para no cortar las caras */
        background-position: 70%;
        z-index: -2;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      main {
        display: flex;
        flex-direction: column;
        /* FIX: Flex-start alinea todo al inicio superior */
        justify-content: flex-start;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 4vh 4vw; /* Padding superior ajustado */
        overflow-y: auto; /* Permite scroll si la pantalla es enana */
      }

      .elemento {
        position: relative;
        text-align: center;
        width: 100%;
        max-width: 90vw;
        order: var(--el-orden, 0);
        /* FIX: Variables dinámicas para empujar elementos de forma responsiva */
        margin-top: var(--el-margen-arriba, 0);
        margin-bottom: var(--el-margen-abajo, 1vh);
        transition: margin 0.3s ease;
      }

      /* ── NOMBRES ── */
      #ui-nombres {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;

        font-family: var(--fuente-titulos);
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: normal;
        line-height: 1.1;
        text-shadow: 2px 2px 8px rgba(30, 10, 15, 0.8);
      }

      .nexo-nombres {
        color: var(--color-dorado);
        font-size: 0.8em;
      }

      .fecha {
        font-size: clamp(1rem, 3vw, 1.3rem);
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--color-dorado);
        text-shadow: 1px 1px 4px rgba(30, 10, 15, 0.8);
        font-weight: bold;
      }
      .mensaje {
        font-size: clamp(0.9rem, 2.5vw, 1.2rem);
        line-height: 1.4;
        text-shadow: 1px 1px 4px rgba(30, 10, 15, 0.8);
        margin: 0 auto;
        max-width: 650px;
      }

      /* ── BOTÓN ── */
      button#btn-abrir-modal {
        background-color: var(--color-boton);
        color: var(--color-texto-boton);
        border: none;
        padding: clamp(0.8rem, 2vh, 1.2rem) clamp(1.5rem, 5vw, 3rem);
        font-size: clamp(1.1rem, 3.5vw, 1.5rem);
        width: 100%;
        max-width: 350px;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
        box-shadow: 0 6px 20px rgba(77, 21, 26, 0.6);
      }
      button#btn-abrir-modal:hover {
        background-color: var(--color-boton-hover);
        color: #fff;
        transform: translateY(-2px);
      }

      /* ── COUNTDOWN ── */
      #seccion-countdown {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        background: rgba(154, 107, 101, 0.35);
        padding: clamp(0.5rem, 1.5vh, 1rem);
        border-radius: 15px;
        backdrop-filter: blur(4px);
      }
      .texto-countdown {
        font-size: clamp(0.8rem, 2vw, 1rem);
        font-style: italic;
      }
      #countdown-container {
        display: flex;
        gap: clamp(0.5rem, 2vw, 1.5rem);
        flex-wrap: nowrap;
        justify-content: center;
      }
      .time-box {
        display: flex;
        flex-direction: column;
        min-width: 50px;
        align-items: center;
      }
      .time-number {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        font-weight: bold;
        font-family: var(--fuente-titulos);
        text-shadow: 2px 2px 6px rgba(30, 10, 15, 0.8);
      }
      .time-label {
        font-size: clamp(0.6rem, 1.5vw, 0.8rem);
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--color-acento);
      }

      @media (min-width: 768px) {
        #ui-nombres {
          flex-direction: row;
          gap: 1.5rem;
        }
      }

      /* ── Modal ── */
      dialog {
        margin: auto;
        border: none;
        border-radius: 12px;
        padding: 0;
        width: 95%;
        max-width: 800px;
        height: 85vh;
        background: transparent;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }
      dialog::backdrop {
        background: rgba(77, 21, 26, 0.85);
        backdrop-filter: blur(5px);
      }
      .modal-header {
        background-color: transparent;
        padding: 10px 15px;
        display: flex;
        justify-content: flex-start;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
      }
      .btn-cerrar {
        pointer-events: auto;
        background: var(--color-rosa-oscuro);
        border: 2px solid var(--color-rosa-claro);
        color: var(--color-rosa-claro);
        font-size: 1.2rem;
        cursor: pointer;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        z-index: 10;
      }
      .btn-cerrar:hover {
        background: var(--color-rosa);
        color: #fff;
        transform: scale(1.1);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        border-radius: 12px;
        background-color: #fff;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="background-container"></div>
    <div id="overlay"></div>

    <main>
      <div class="elemento" id="wrap-nombres"><h1 id="ui-nombres"></h1></div>
      <div class="elemento" id="wrap-fecha">
        <p class="fecha" id="ui-fecha"></p>
      </div>
      <div class="elemento" id="wrap-mensaje">
        <p class="mensaje" id="ui-mensaje"></p>
      </div>
      <div class="elemento" id="wrap-boton">
        <button
          id="btn-abrir-modal"
          aria-label="Abrir formulario para subir fotos"
        ></button>
      </div>
      <div class="elemento" id="wrap-countdown">
        <div id="seccion-countdown">
          <p class="texto-countdown" id="ui-texto-countdown"></p>
          <div id="countdown-container">
            <div class="time-box">
              <span class="time-number" id="cd-dias">00</span
              ><span class="time-label">Días</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-horas">00</span
              ><span class="time-label">Horas</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-minutos">00</span
              ><span class="time-label">Min</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-segundos">00</span
              ><span class="time-label">Seg</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <dialog id="modal-formulario">
      <div class="modal-header">
        <button
          class="btn-cerrar"
          id="btn-cerrar-modal"
          aria-label="Cerrar ventana"
        >
          ✖
        </button>
      </div>
      <iframe
        id="iframe-google"
        src=""
        title="Formulario de Google para subir fotos"
        allow="web-share; camera; microphone"
      ></iframe>
    </dialog>

    <script>
      /* ═══════════════════════════════════════════════════════════════════════════
         ██████████  P A N E L   D E   C O N T R O L   M A E S T R O  ██████████
         ═══════════════════════════════════════════════════════════════════════════ */
      const CONFIG = {
        visibilidad: {
          nombres: true,
          fecha: true,
          mensaje: true,
          boton: true,
          countdown: false,
        },

        nombresEstructurados: {
          persona1: "Lidia",
          nexo: "&",
          persona2: "Tomás",
        },

        fechaTexto: "2 de mayo de 2026",
        mensajeBienvenida:
          "¡Ayudadnos a capturar la magia de nuestra boda! Usad este espacio para subir las fotos y vídeos que vayáis haciendo.",
        textoBoton: "📸 Subir Fotos",
        textoCountdown: "Aún tienes tiempo para subir tus mejores recuerdos:",
        fechaBodaISO: "2026-05-02T00:00:00",

        urlImagenFondo: "imagen/flt.png",
        urlGoogleScript:
          "https://script.google.com/macros/s/AKfycbybUY9124-tgaq0GVJL2-ZL_TrOIYNcCKZKXncVVgDZr9-rkut_GhYlQ-kEmPuVw0s3lg/exec",

        overlayColor: "rgba(77, 21, 26, 0.40)",

        /* FIX: El margenAbajo 'auto' en los nombres empuja los demás elementos hacia abajo de forma natural */
        posicionPC: {
          nombres: { orden: 1, margenArriba: "2vh", margenAbajo: "auto" },
          fecha: { orden: 2, margenArriba: "0", margenAbajo: "3vh" },
          mensaje: { orden: 3, margenArriba: "0", margenAbajo: "4vh" },
          boton: { orden: 4, margenArriba: "0", margenAbajo: "5vh" },
          countdown: { orden: 5, margenArriba: "0", margenAbajo: "0" },
        },

        posicionMovil: {
          nombres: { orden: 1, margenArriba: "4vh", margenAbajo: "auto" },
          fecha: { orden: 2, margenArriba: "0", margenAbajo: "1.5vh" },
          mensaje: { orden: 3, margenArriba: "0", margenAbajo: "3vh" },
          boton: { orden: 4, margenArriba: "0", margenAbajo: "5vh" },
          countdown: { orden: 5, margenArriba: "0", margenAbajo: "0" },
        },
      };

      /* ═══════════════════════════════════════════════════════════════════════════
         LÓGICA DEL SISTEMA 
         ═══════════════════════════════════════════════════════════════════════════ */
      const contenedorNombres = document.getElementById("ui-nombres");
      contenedorNombres.innerHTML = "";

      const spanP1 = document.createElement("span");
      spanP1.textContent = CONFIG.nombresEstructurados.persona1;

      const spanNexo = document.createElement("span");
      spanNexo.className = "nexo-nombres";
      spanNexo.textContent = CONFIG.nombresEstructurados.nexo;

      const spanP2 = document.createElement("span");
      spanP2.textContent = CONFIG.nombresEstructurados.persona2;

      contenedorNombres.append(spanP1, spanNexo, spanP2);

      document.getElementById("ui-fecha").textContent = CONFIG.fechaTexto;
      document.getElementById("ui-mensaje").textContent =
        CONFIG.mensajeBienvenida;
      document.getElementById("btn-abrir-modal").textContent =
        CONFIG.textoBoton;
      document.getElementById("ui-texto-countdown").textContent =
        CONFIG.textoCountdown;

      const MAPA_IDS = {
        nombres: "wrap-nombres",
        fecha: "wrap-fecha",
        mensaje: "wrap-mensaje",
        boton: "wrap-boton",
        countdown: "wrap-countdown",
      };

      Object.entries(MAPA_IDS).forEach(([clave, id]) => {
        const elemento = document.getElementById(id);
        if (elemento && CONFIG.visibilidad[clave] === false) {
          elemento.classList.add("hidden");
        }
      });

      document.getElementById("overlay").style.backgroundColor =
        CONFIG.overlayColor;
      if (CONFIG.urlImagenFondo) {
        document.getElementById("background-container").style.backgroundImage =
          `url('${CONFIG.urlImagenFondo}')`;
      } else {
        document.getElementById("background-container").style.backgroundColor =
          "#4D151A";
      }

      if (
        CONFIG.urlGoogleScript &&
        !CONFIG.urlGoogleScript.includes("URL_DE_TU")
      ) {
        document.getElementById("iframe-google").src = CONFIG.urlGoogleScript;
      }

      /* FIX: Inyección de márgenes dinámicos incluyendo el margen superior */
      function aplicarDistribucion(bloquePosiciones) {
        Object.entries(MAPA_IDS).forEach(([clave, id]) => {
          const el = document.getElementById(id);
          const configElem = bloquePosiciones[clave];
          if (!el || !configElem) return;
          el.style.setProperty("--el-orden", configElem.orden);
          el.style.setProperty(
            "--el-margen-arriba",
            configElem.margenArriba || "0",
          );
          el.style.setProperty(
            "--el-margen-abajo",
            configElem.margenAbajo || "1vh",
          );
        });
      }

      const mediaMovil = window.matchMedia("(max-width: 768px)");
      function actualizarLayout(e) {
        aplicarDistribucion(
          e.matches ? CONFIG.posicionMovil : CONFIG.posicionPC,
        );
      }
      mediaMovil.addEventListener("change", actualizarLayout);
      actualizarLayout(mediaMovil);

      const modal = document.getElementById("modal-formulario");
      const btnAbrir = document.getElementById("btn-abrir-modal");
      const btnCerrar = document.getElementById("btn-cerrar-modal");

      btnAbrir.addEventListener("click", () => modal.showModal());
      btnCerrar.addEventListener("click", () => modal.close());
      modal.addEventListener("click", (e) => {
        const r = modal.getBoundingClientRect();
        if (
          e.clientX < r.left ||
          e.clientX > r.right ||
          e.clientY < r.top ||
          e.clientY > r.bottom
        ) {
          modal.close();
        }
      });

      if (CONFIG.visibilidad.countdown) {
        const objetivo = new Date(CONFIG.fechaBodaISO).getTime();
        const tick = setInterval(() => {
          const diff = objetivo - Date.now();
          if (diff < 0) {
            clearInterval(tick);
            document
              .getElementById("seccion-countdown")
              .classList.add("hidden");
            return;
          }
          document.getElementById("cd-dias").textContent = Math.floor(
            diff / 86400000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-horas").textContent = Math.floor(
            (diff % 86400000) / 3600000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-minutos").textContent = Math.floor(
            (diff % 3600000) / 60000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-segundos").textContent = Math.floor(
            (diff % 60000) / 1000,
          )
            .toString()
            .padStart(2, "0");
        }, 1000);
      }
    </script>
  </body>
</html>

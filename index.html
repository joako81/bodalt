<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sube las fotos de la boda de Lidia y Tomás."
    />
    <title>Sube tus fotos - Lidia y Tomás</title>
    <style>
      :root {
        --color-texto-principal: #fff8f0;
        --color-acento: #d4af37;
        --color-boton: #d9b3a8;
        --color-boton-hover: #c59a8e;
        --overlay-color: rgba(30, 20, 20, 0.65);
        --fuente-titulos: "Georgia", serif;
        --fuente-texto: "Helvetica Neue", Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        /* Usamos dvh (Dynamic Viewport Height) para pantalla completa real en móviles */
        min-height: 100dvh;
        width: 100%;
        font-family: var(--fuente-texto);
        color: var(--color-texto-principal);
        /* Quitamos overflow hidden para permitir scroll si la pantalla es enana, evitando recortes */
        overflow-x: hidden;
      }

      #background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        z-index: -2;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--overlay-color);
        z-index: -1;
      }

      /* ── ARQUITECTURA FLEXBOX (FLUIDA Y RELATIVA) ── */
      main {
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centra todo el bloque verticalmente */
        align-items: center; /* Centra horizontalmente */
        width: 100%;
        min-height: 100dvh;
        padding: 2rem 1rem; /* Márgenes de seguridad laterales */
      }

      .elemento {
        position: relative;
        text-align: center;
        width: 100%;
        max-width: 90vw;
        /* Las variables ahora controlan el orden y el espacio, inyectadas por JS */
        order: var(--el-orden, 0);
        margin-bottom: var(--el-margen-abajo, 1rem);
        transition: margin 0.3s ease;
      }

      /* ── TAMAÑOS BASE (MOBILE FIRST - AUMENTADOS) ── */
      h1 {
        font-family: var(--fuente-titulos);
        font-size: 3.5rem; /* Texto principal más grande */
        font-weight: normal;
        line-height: 1.1;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
      }
      .fecha {
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--color-acento);
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        font-weight: bold;
      }
      .mensaje {
        font-size: 1.15rem; /* Mensaje más legible */
        line-height: 1.6;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        margin: 0 auto;
        max-width: 600px;
      }

      /* ── BOTÓN GIGANTE ── */
      button#btn-abrir-modal {
        background-color: var(--color-boton);
        color: #2c1e16;
        border: none;
        padding: 1.2rem 2rem; /* Más área táctil */
        font-size: 1.4rem; /* Letra más grande */
        width: 100%; /* Ocupa todo el ancho en móvil */
        max-width: 350px; /* Tope máximo para que no sea excesivo en tablet */
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }
      button#btn-abrir-modal:hover {
        background-color: var(--color-boton-hover);
        transform: translateY(-2px);
      }

      /* ── COUNTDOWN ── */
      #seccion-countdown {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        background: rgba(0, 0, 0, 0.3); /* Fondo sutil para dar contraste */
        padding: 1rem;
        border-radius: 15px;
      }
      .texto-countdown {
        font-size: 1rem;
        font-style: italic;
      }
      #countdown-container {
        display: flex;
        gap: 1.2rem;
        flex-wrap: nowrap;
        justify-content: center;
      }
      .time-box {
        display: flex;
        flex-direction: column;
        min-width: 55px;
        align-items: center;
      }
      .time-number {
        font-size: 2rem;
        font-weight: bold;
        font-family: var(--fuente-titulos);
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
      }
      .time-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--color-acento);
      }

      /* ── TAMAÑOS ESCALADOS (TABLET / PC) ── */
      @media (min-width: 768px) {
        h1 {
          font-size: clamp(4rem, 8vw, 6rem);
        }
        .fecha {
          font-size: 1.4rem;
        }
        .mensaje {
          font-size: 1.3rem;
        }
        button#btn-abrir-modal {
          font-size: 1.5rem;
          max-width: 400px;
        }
        .time-number {
          font-size: 2.5rem;
        }
        .time-label {
          font-size: 0.9rem;
        }
      }

      /* ── Modal ── */
      dialog {
        margin: auto;
        border: none;
        border-radius: 12px;
        padding: 0;
        width: 95%;
        max-width: 800px;
        height: 85vh;
        background: transparent;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
      }
      .modal-header {
        background-color: transparent;
        padding: 10px 15px;
        display: flex;
        justify-content: flex-start; /* Aspa a la izquierda */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
      }
      .btn-cerrar {
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #fff;
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        z-index: 10;
      }
      .btn-cerrar:hover {
        background: rgba(0, 0, 0, 0.8);
        transform: scale(1.1);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        border-radius: 12px;
        background-color: transparent;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="background-container"></div>
    <div id="overlay"></div>

    <main>
      <div class="elemento" id="wrap-nombres"><h1 id="ui-nombres"></h1></div>
      <div class="elemento" id="wrap-fecha">
        <p class="fecha" id="ui-fecha"></p>
      </div>
      <div class="elemento" id="wrap-mensaje">
        <p class="mensaje" id="ui-mensaje"></p>
      </div>
      <div class="elemento" id="wrap-boton">
        <button
          id="btn-abrir-modal"
          aria-label="Abrir formulario para subir fotos"
        ></button>
      </div>
      <div class="elemento" id="wrap-countdown">
        <div id="seccion-countdown">
          <p class="texto-countdown" id="ui-texto-countdown"></p>
          <div id="countdown-container">
            <div class="time-box">
              <span class="time-number" id="cd-dias">00</span
              ><span class="time-label">Días</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-horas">00</span
              ><span class="time-label">Horas</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-minutos">00</span
              ><span class="time-label">Min</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-segundos">00</span
              ><span class="time-label">Seg</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <dialog id="modal-formulario">
      <div class="modal-header">
        <button
          class="btn-cerrar"
          id="btn-cerrar-modal"
          aria-label="Cerrar ventana"
        >
          ✖
        </button>
      </div>
      <iframe
        id="iframe-google"
        src=""
        title="Formulario de Google para subir fotos"
      ></iframe>
    </dialog>

    <script>
      /* ═══════════════════════════════════════════════════════════════════════════
         ██████████  P A N E L   D E   C O N T R O L   M A E S T R O  ██████████
         ═══════════════════════════════════════════════════════════════════════════ */
      const CONFIG = {
        visibilidad: {
          nombres: true,
          fecha: true,
          mensaje: true,
          boton: true,
          countdown: false,
        },

        nombres: "Lidia & Tomás",
        fechaTexto: "2 de mayo de 2026",
        mensajeBienvenida:
          "¡Ayudadnos a capturar la magia de nuestra boda! Usad este espacio para subir las fotos y vídeos que vayáis haciendo.",
        textoBoton: "📸 Subir Fotos",
        textoCountdown: "Aún tienes tiempo para subir tus mejores recuerdos:",
        fechaBodaISO: "2026-05-02T00:00:00",

        urlImagenFondo: "imagen/FOTO-BODA_w.webp",
        urlGoogleScript:
          "https://script.google.com/macros/s/AKfycbwD6WvMSIZw0d7TWAFz7x5cLL6OheBeDgSmqMERExoWUWLAENmng_CcfPSnfW4g6C1wtQ/exec",
        overlayColor: "rgba(30, 20, 20, 0.65)",

        /* ── ESTRUCTURA (FLUIDA). Orden (1, 2, 3...) y Margen (espacio debajo) ──── */
        /* Configuración para ORDENADORES / TABLETS */
        posicionPC: {
          nombres: { orden: 1, margenAbajo: "17rem" },
          fecha: { orden: 2, margenAbajo: "2rem" },
          mensaje: { orden: 3, margenAbajo: "3rem" },
          boton: { orden: 4, margenAbajo: "3rem" },
          countdown: { orden: 5, margenAbajo: "0" },
        },

        /* Configuración para MÓVILES */
        posicionMovil: {
          nombres: { orden: 1, margenAbajo: "12rem" },
          fecha: { orden: 2, margenAbajo: "1.5rem" },
          mensaje: { orden: 3, margenAbajo: "2.5rem" },
          boton: { orden: 4, margenAbajo: "3rem" },
          countdown: { orden: 5, margenAbajo: "0" },
        },
      };

      /* ═══════════════════════════════════════════════════════════════════════════
         LÓGICA DEL SISTEMA 
         ═══════════════════════════════════════════════════════════════════════════ */
      document.getElementById("ui-nombres").textContent = CONFIG.nombres;
      document.getElementById("ui-fecha").textContent = CONFIG.fechaTexto;
      document.getElementById("ui-mensaje").textContent =
        CONFIG.mensajeBienvenida;
      document.getElementById("btn-abrir-modal").textContent =
        CONFIG.textoBoton;
      document.getElementById("ui-texto-countdown").textContent =
        CONFIG.textoCountdown;

      const MAPA_IDS = {
        nombres: "wrap-nombres",
        fecha: "wrap-fecha",
        mensaje: "wrap-mensaje",
        boton: "wrap-boton",
        countdown: "wrap-countdown",
      };

      Object.entries(MAPA_IDS).forEach(([clave, id]) => {
        const elemento = document.getElementById(id);
        if (elemento && CONFIG.visibilidad[clave] === false) {
          elemento.classList.add("hidden");
        }
      });

      document.getElementById("overlay").style.backgroundColor =
        CONFIG.overlayColor;
      if (CONFIG.urlImagenFondo) {
        document.getElementById("background-container").style.backgroundImage =
          `url('${CONFIG.urlImagenFondo}')`;
      } else {
        document.getElementById("background-container").style.backgroundColor =
          "#2C1E16";
      }

      if (
        CONFIG.urlGoogleScript &&
        !CONFIG.urlGoogleScript.includes("URL_DE_TU")
      ) {
        document.getElementById("iframe-google").src = CONFIG.urlGoogleScript;
      }

      /* Función que inyecta Orden y Margen inferior en vez de posiciones absolutas */
      function aplicarDistribucion(bloquePosiciones) {
        Object.entries(MAPA_IDS).forEach(([clave, id]) => {
          const el = document.getElementById(id);
          const configElem = bloquePosiciones[clave];
          if (!el || !configElem) return;
          el.style.setProperty("--el-orden", configElem.orden);
          el.style.setProperty("--el-margen-abajo", configElem.margenAbajo);
        });
      }

      const mediaMovil = window.matchMedia("(max-width: 768px)");
      function actualizarLayout(e) {
        aplicarDistribucion(
          e.matches ? CONFIG.posicionMovil : CONFIG.posicionPC,
        );
      }
      mediaMovil.addEventListener("change", actualizarLayout);
      actualizarLayout(mediaMovil); // Ejecuta al iniciar

      const modal = document.getElementById("modal-formulario");
      const btnAbrir = document.getElementById("btn-abrir-modal");
      const btnCerrar = document.getElementById("btn-cerrar-modal");

      btnAbrir.addEventListener("click", () => modal.showModal());
      btnCerrar.addEventListener("click", () => modal.close());
      modal.addEventListener("click", (e) => {
        const r = modal.getBoundingClientRect();
        if (
          e.clientX < r.left ||
          e.clientX > r.right ||
          e.clientY < r.top ||
          e.clientY > r.bottom
        ) {
          modal.close();
        }
      });

      if (CONFIG.visibilidad.countdown) {
        const objetivo = new Date(CONFIG.fechaBodaISO).getTime();
        const tick = setInterval(() => {
          const diff = objetivo - Date.now();
          if (diff < 0) {
            clearInterval(tick);
            document
              .getElementById("seccion-countdown")
              .classList.add("hidden");
            return;
          }
          document.getElementById("cd-dias").textContent = Math.floor(
            diff / 86400000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-horas").textContent = Math.floor(
            (diff % 86400000) / 3600000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-minutos").textContent = Math.floor(
            (diff % 3600000) / 60000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-segundos").textContent = Math.floor(
            (diff % 60000) / 1000,
          )
            .toString()
            .padStart(2, "0");
        }, 1000);
      }
    </script>
  </body>
</html>

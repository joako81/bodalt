<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sube las fotos de la boda de Lidia y Tomás."
    />
    <title>Sube tus fotos - Lidia y Tomás</title>
    <style>
      :root {
        --color-texto-principal: #fff8f0;
        --color-acento: #d4af37;
        --color-boton: #d9b3a8;
        --color-boton-hover: #c59a8e;
        --overlay-color: rgba(30, 20, 20, 0.65);
        --fuente-titulos: "Georgia", serif;
        --fuente-texto: "Helvetica Neue", Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        height: 100%;
        font-family: var(--fuente-texto);
        color: var(--color-texto-principal);
        overflow: hidden;
      }

      #background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        z-index: -2;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--overlay-color);
        z-index: -1;
      }

      /* El main ocupa toda la pantalla; los hijos se posicionan con absolute */
      main {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Cada elemento se mueve con variables CSS inyectadas desde JS */
      .elemento {
        position: absolute;
        text-align: center;
        top: var(--el-top, auto);
        left: var(--el-left, auto);
        right: var(--el-right, auto);
        bottom: var(--el-bottom, auto);
        transform: var(--el-transform, none);
        width: var(--el-width, auto);
        max-width: var(--el-max-width, 90vw);
      }

      /* ── Estilos visuales (idénticos al original) ── */
      h1 {
        font-family: var(--fuente-titulos);
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: normal;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
      }
      .fecha {
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--color-acento);
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
      }
      .mensaje {
        font-size: 1.1rem;
        line-height: 1.6;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
      }
      button {
        background-color: var(--color-boton);
        color: #2c1e16;
        border: none;
        padding: 1rem 2.5rem;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }
      button:hover {
        background-color: var(--color-boton-hover);
        transform: translateY(-2px);
      }
      #seccion-countdown {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
      }
      .texto-countdown {
        font-size: 1rem;
        font-style: italic;
        opacity: 0.9;
      }
      #countdown-container {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .time-box {
        display: flex;
        flex-direction: column;
        min-width: 60px;
        align-items: center;
      }
      .time-number {
        font-size: 2.2rem;
        font-weight: bold;
        font-family: var(--fuente-titulos);
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
      }
      .time-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--color-acento);
      }

      /* ── Modal ── */
      dialog {
        margin: auto;
        border: none;
        border-radius: 12px;
        padding: 0;
        width: 95%;
        max-width: 800px;
        height: 85vh;
        background: transparent;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px);
      }
      .modal-header {
        background-color: transparent;
        padding: 10px 15px;
        display: flex;
        justify-content: flex-end;
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        pointer-events: none;
      }
      .btn-cerrar {
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #fff;
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        z-index: 10;
      }
      .btn-cerrar:hover {
        background: rgba(0, 0, 0, 0.8);
        transform: scale(1.1);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        border-radius: 12px;
        background-color: transparent;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="background-container"></div>
    <div id="overlay"></div>

    <main>
      <div class="elemento" id="wrap-nombres">
        <h1 id="ui-nombres"></h1>
      </div>

      <div class="elemento" id="wrap-fecha">
        <p class="fecha" id="ui-fecha"></p>
      </div>

      <div class="elemento" id="wrap-mensaje">
        <p class="mensaje" id="ui-mensaje"></p>
      </div>

      <div class="elemento" id="wrap-boton">
        <button
          id="btn-abrir-modal"
          aria-label="Abrir formulario para subir fotos"
        ></button>
      </div>

      <div class="elemento" id="wrap-countdown">
        <div id="seccion-countdown">
          <p class="texto-countdown" id="ui-texto-countdown"></p>
          <div id="countdown-container">
            <div class="time-box">
              <span class="time-number" id="cd-dias">00</span
              ><span class="time-label">Días</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-horas">00</span
              ><span class="time-label">Horas</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-minutos">00</span
              ><span class="time-label">Min</span>
            </div>
            <div class="time-box">
              <span class="time-number" id="cd-segundos">00</span
              ><span class="time-label">Seg</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <dialog id="modal-formulario">
      <div class="modal-header">
        <button
          class="btn-cerrar"
          id="btn-cerrar-modal"
          aria-label="Cerrar ventana"
        >
          ✖
        </button>
      </div>
      <iframe
        id="iframe-google"
        src=""
        title="Formulario de Google para subir fotos"
      ></iframe>
    </dialog>

    <script>
      /* ═══════════════════════════════════════════════════════════════════════════
         ██████████  C O N F I G U R A C I Ó N  ██████████
         ═══════════════════════════════════════════════════════════════════════════ */
      const CONFIG = {
        /* ── TEXTOS ─────────────────────────────────────────────────────────────── */
        nombres: "Lidia & Tomás",
        fechaTexto: "2 de mayo de 2026",
        mensajeBienvenida:
          "¡Ayudadnos a capturar la magia de nuestra boda! Usad este espacio para subir las fotos y vídeos que vayáis haciendo.",
        textoBoton: "📸 Subir Fotos",
        textoCountdown: "Aún tienes tiempo para subir tus mejores recuerdos:",

        /* ── IMAGEN Y OVERLAY ───────────────────────────────────────────────────── */
        urlImagenFondo: "/imagen/FOTO-BODA_w.webp",
        urlGoogleScript:
          "https://script.google.com/macros/s/AKfycbwD6WvMSIZw0d7TWAFz7x5cLL6OheBeDgSmqMERExoWUWLAENmng_CcfPSnfW4g6C1wtQ/exec",
        overlayColor: "rgba(30, 20, 20, 0.65)",

        /* ── COUNTDOWN ──────────────────────────────────────────────────────────── */
        activarCountdown: true,
        fechaBodaISO: "2026-05-02T00:00:00",

        /* ═══════════════════════════════════════════════════════════════════════════
           POSICIÓN DE CADA ELEMENTO
           ═══════════════════════════════════════════════════════════════════════════

           Usa porcentajes (%) para posicionar relativo a la pantalla.
           Usa píxeles (px) si prefieres valores fijos.
           Deja "" en las propiedades que no quieras usar.

           PROPIEDADES:
             top      → distancia desde el BORDE SUPERIOR de la pantalla
             bottom   → distancia desde el BORDE INFERIOR
             left     → distancia desde el BORDE IZQUIERDO
             right    → distancia desde el BORDE DERECHO
             transform→ ajuste extra. Ejemplos:
                          "translateX(-50%)"         → centra en horizontal (usar con left:"50%")
                          "translateY(-50%)"         → centra en vertical   (usar con top:"50%")
                          "translate(-50%, -50%)"    → centra en ambos ejes (usar con top y left al 50%)
                          "none"                     → sin ajuste
             width    → anchura del bloque. "auto" o "500px" o "80%"
             maxWidth → anchura máxima (evita que se salga en pantallas grandes)

           RECETAS RÁPIDAS:
           ┌─────────────────────────────────────────────────────────────────────┐
           │ Centrado horizontal:  left:"50%",  transform:"translateX(-50%)"     │
           │ Centrado total:       left:"50%", top:"50%", transform:"translate(-50%,-50%)"│
           │ Arriba a la derecha:  right:"5%", top:"10%", left:"", transform:"none"      │
           │ Abajo centrado:       left:"50%", bottom:"5%", top:"", transform:"translateX(-50%)" │
           └─────────────────────────────────────────────────────────────────────┘
           ═══════════════════════════════════════════════════════════════════════════ */

        /* ── POSICIONES EN ORDENADOR / TABLET (pantalla > 768px) ─────────────────── */
        posicionPC: {
          nombres: {
            top: "38%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },

          fecha: {
            top: "55%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },

          mensaje: {
            top: "62%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "600px",
            maxWidth: "90vw",
          },

          boton: {
            top: "76%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },

          countdown: {
            top: "86%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },
        } /* ── fin posicionPC ── */,

        /* ── POSICIONES EN MÓVIL (pantalla ≤ 768px) ──────────────────────────────── */
        posicionMovil: {
          nombres: {
            top: "30%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },

          fecha: {
            top: "50%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },

          mensaje: {
            top: "57%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "85vw",
            maxWidth: "85vw",
          },

          boton: {
            top: "74%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },

          countdown: {
            top: "84%",
            bottom: "",
            left: "50%",
            right: "",
            transform: "translateX(-50%)",
            width: "auto",
            maxWidth: "90vw",
          },
        } /* ── fin posicionMovil ── */,
      }; /* ← FIN CONFIG */

      /* ═══════════════════════════════════════════════════════════════════════════
         LÓGICA — no es necesario tocar nada a partir de aquí
         ═══════════════════════════════════════════════════════════════════════════ */

      // Textos
      document.getElementById("ui-nombres").textContent = CONFIG.nombres;
      document.getElementById("ui-fecha").textContent = CONFIG.fechaTexto;
      document.getElementById("ui-mensaje").textContent =
        CONFIG.mensajeBienvenida;
      document.getElementById("btn-abrir-modal").textContent =
        CONFIG.textoBoton;
      document.getElementById("ui-texto-countdown").textContent =
        CONFIG.textoCountdown;

      // Overlay e imagen
      document.getElementById("overlay").style.backgroundColor =
        CONFIG.overlayColor;
      if (CONFIG.urlImagenFondo) {
        document.getElementById("background-container").style.backgroundImage =
          `url('${CONFIG.urlImagenFondo}')`;
      } else {
        document.getElementById("background-container").style.backgroundColor =
          "#2C1E16";
      }

      // Google iframe
      if (
        CONFIG.urlGoogleScript &&
        !CONFIG.urlGoogleScript.includes("URL_DE_TU")
      ) {
        document.getElementById("iframe-google").src = CONFIG.urlGoogleScript;
      }

      // ── Aplicar posiciones ─────────────────────────────────────────────────────
      const MAPA_IDS = {
        nombres: "wrap-nombres",
        fecha: "wrap-fecha",
        mensaje: "wrap-mensaje",
        boton: "wrap-boton",
        countdown: "wrap-countdown",
      };

      function aplicarPosicion(bloque) {
        Object.entries(MAPA_IDS).forEach(([clave, id]) => {
          const el = document.getElementById(id);
          const p = bloque[clave];
          if (!el || !p) return;
          el.style.setProperty("--el-top", p.top || "auto");
          el.style.setProperty("--el-left", p.left || "auto");
          el.style.setProperty("--el-right", p.right || "auto");
          el.style.setProperty("--el-bottom", p.bottom || "auto");
          el.style.setProperty("--el-transform", p.transform || "none");
          el.style.setProperty("--el-width", p.width || "auto");
          el.style.setProperty("--el-max-width", p.maxWidth || "90vw");
        });
      }

      const mediaMovil = window.matchMedia("(max-width: 768px)");

      function actualizarLayout(e) {
        aplicarPosicion(e.matches ? CONFIG.posicionMovil : CONFIG.posicionPC);
      }

      mediaMovil.addEventListener("change", actualizarLayout);
      actualizarLayout(mediaMovil); // ejecutar al cargar la página

      // ── Modal ──────────────────────────────────────────────────────────────────
      const modal = document.getElementById("modal-formulario");
      const btnAbrir = document.getElementById("btn-abrir-modal");
      const btnCerrar = document.getElementById("btn-cerrar-modal");

      btnAbrir.addEventListener("click", () => modal.showModal());
      btnCerrar.addEventListener("click", () => modal.close());
      modal.addEventListener("click", (e) => {
        const r = modal.getBoundingClientRect();
        if (
          e.clientX < r.left ||
          e.clientX > r.right ||
          e.clientY < r.top ||
          e.clientY > r.bottom
        ) {
          modal.close();
        }
      });

      // ── Countdown ─────────────────────────────────────────────────────────────
      if (!CONFIG.activarCountdown) {
        document.getElementById("seccion-countdown").classList.add("hidden");
      } else {
        const objetivo = new Date(CONFIG.fechaBodaISO).getTime();
        const tick = setInterval(() => {
          const diff = objetivo - Date.now();
          if (diff < 0) {
            clearInterval(tick);
            document
              .getElementById("seccion-countdown")
              .classList.add("hidden");
            return;
          }
          document.getElementById("cd-dias").textContent = Math.floor(
            diff / 86400000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-horas").textContent = Math.floor(
            (diff % 86400000) / 3600000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-minutos").textContent = Math.floor(
            (diff % 3600000) / 60000,
          )
            .toString()
            .padStart(2, "0");
          document.getElementById("cd-segundos").textContent = Math.floor(
            (diff % 60000) / 1000,
          )
            .toString()
            .padStart(2, "0");
        }, 1000);
      }
    </script>
  </body>
</html>
